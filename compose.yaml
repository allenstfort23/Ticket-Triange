services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ticket_triage
      POSTGRES_USER: ticket_triage
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
       - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
